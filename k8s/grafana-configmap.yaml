apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: customer-success-fte
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus:9090
        uid: prometheus
        isDefault: false
        editable: false
      - name: PostgreSQL
        type: postgres
        access: proxy
        url: $__env{DATABASE_HOST}:$__env{DATABASE_PORT}
        database: $__env{DATABASE_NAME}
        user: $__env{DATABASE_USER}
        uid: postgres
        isDefault: true
        editable: false
        jsonData:
          sslmode: require
          postgresVersion: 1600
          timescaledb: false
        secureJsonData:
          password: $__env{DATABASE_PASSWORD}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards-config
  namespace: customer-success-fte
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: 'default'
        orgId: 1
        folder: ''
        type: file
        disableDeletion: false
        updateIntervalSeconds: 10
        allowUiUpdates: true
        options:
          path: /var/lib/grafana/dashboards
