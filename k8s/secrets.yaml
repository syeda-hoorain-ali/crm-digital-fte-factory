apiVersion: v1
kind: Secret
metadata:
  name: fte-secrets
  namespace: customer-success-fte
  labels:
    app: customer-success-fte
type: Opaque
stringData:
  # Database (Required)
  DATABASE_URL: "${DATABASE_URL}"

  # Database connection parameters (parsed from DATABASE_URL for Grafana)
  DATABASE_HOST: "${DATABASE_HOST}"
  DATABASE_PORT: "${DATABASE_PORT}"
  DATABASE_NAME: "${DATABASE_NAME}"
  DATABASE_USER: "${DATABASE_USER}"
  DATABASE_PASSWORD: "${DATABASE_PASSWORD}"

  # Gemini API (Required)
  GEMINI_API_KEY: "${GEMINI_API_KEY}"

  # Gmail API (Required - JSON credentials as string)
  GMAIL_SERVICE_ACCOUNT_PATH: "${GMAIL_SERVICE_ACCOUNT_PATH}"

  # Gmail Webhook (Optional)
  GMAIL_WEBHOOK_SECRET: "${GMAIL_WEBHOOK_SECRET:-}"

  # Twilio (Required)
  TWILIO_ACCOUNT_SID: "${TWILIO_ACCOUNT_SID}"
  TWILIO_AUTH_TOKEN: "${TWILIO_AUTH_TOKEN}"
  TWILIO_APP_NUMBER: "${TWILIO_APP_NUMBER}"
  TWILIO_WEBHOOK_SECRET: "${TWILIO_WEBHOOK_SECRET}"

  # SMTP Credentials (Optional - for email notifications)
  SMTP_USERNAME: "${SMTP_USERNAME:-}"
  SMTP_PASSWORD: "${SMTP_PASSWORD:-}"

  # Grafana Admin Password 
  GRAFANA_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:-}"

